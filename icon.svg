<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="XMT Mecha Skin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14171C"/>
      <stop offset="1" stop-color="#070A0E"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.12"/>

  <!-- corner brackets: the one piece of mecha signalling in the mark -->
  <g stroke="#64D2FF" stroke-opacity="0.85" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M56 168 V72 a16 16 0 0 1 16-16 h96"/>
    <path d="M456 344 v96 a16 16 0 0 1-16 16 h-96"/>
  </g>

  <text x="256" y="292" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace"
        font-size="132" font-weight="600" letter-spacing="6" fill="#F5F5F7">XMT</text>

  <rect x="184" y="322" width="144" height="6" rx="3" fill="#0A84FF"/>
</svg>
